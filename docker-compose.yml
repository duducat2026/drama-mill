# Drama Mill 一体化编排：应用 + MySQL 8.4。
# 默认端口：应用 5679、MySQL 宿主侧 3307。生产部署前务必改 JWT_SECRET 与数据库口令。
services:

  drama-mill:
    build: .
    restart: unless-stopped
    ports:
      - "5679:5679"
    environment:
      NODE_ENV: production
      PORT: 5679
      DATABASE_URL: mysql://dramamill:dramamill_tool@mysql:3306/drama_mill
      JWT_SECRET: drama-mill-jwt-secret-change-me
      # 分类存储外挂到独立磁盘时启用，并与下方 volumes 对应：
      # ASSET_PATH: /media/images
      # VIDEO_PATH: /media/videos
      # MERGED_PATH: /media/merged
      # UPLOAD_PATH: /media/uploads
    volumes:
      - ./data:/app/data
      # skills 支持在线编辑且 workspace 是 Agent 文件读写 jail 根，需持久化
      - ./backend/workspace:/app/backend/workspace
      # - /mnt/media/images:/media/images
      # - /mnt/media/videos:/media/videos
      # - /mnt/media/merged:/media/merged
      # - /mnt/media/uploads:/media/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5679/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: drama-mill_root
      MYSQL_DATABASE: drama_mill
      MYSQL_USER: dramamill
      MYSQL_PASSWORD: dramamill_tool
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # MySQL 数据卷首次初始化时按文件名顺序自动执行（已有卷不重跑）：
      # 01 建表与内置种子，02 模型目录数据快照（下载即用，无需外部采集库）
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/model-catalog-data.sql:/docker-entrypoint-initdb.d/02-model-catalog-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdrama-mill_root"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
