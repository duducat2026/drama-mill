# Drama Mill Nginx 反向代理配置（云端 /etc/nginx/conf.d/drama-mill.conf）
# 域名: your-domain.com (Let's Encrypt 证书)
# 80: ACME 验证 + 全量 301 跳转 HTTPS
# 443: HTTPS 转发到后端 127.0.0.1:5679
# 通用转发参数：SSE 流式接口需关闭缓冲；生产任务接口耗时较长需放宽超时
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # default_server: 压过 nginx.conf 内置默认站点，避免请求被默认站 404
    listen 80 default_server;
    server_name your-domain.com;

    # Let's Encrypt HTTP-01 验证路径（续期时必须可达, 不能跳转）
    location /.well-known/acme-challenge/ {
        root /var/www/drama-mill;
    }

    # 其余全部 301 跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 写法: http2 跟在 listen 行 (1.25+ 才支持独立的 'http2 on;')
    listen 443 ssl http2 default_server;
    server_name your-domain.com;

    # Let's Encrypt 证书（certbot 签发, certbot-renew.timer 自动续期）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include /etc/nginx/conf.d/drama-mill.common.inc;
}
