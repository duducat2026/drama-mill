# 80/443 共用的转发规则（被 drama-mill.conf 的两个 server include）

# 参考视频/音频上传最大 100MB
client_max_body_size 100m;

# 开启 gzip：前端 JS/CSS/JSON 传输体积降 ~65%（对反代响应与直连静态均生效）
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# 前端构建产物（文件名带内容哈希）：直连磁盘 + 长期不可变缓存，回访零下载
location /_nuxt/ {
    alias /opt/drama-mill/frontend/dist/_nuxt/;
    sendfile on;
    tcp_nopush on;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# 生成的图片/视频直连磁盘，不经过 Node：sendfile 零拷贝 + 长缓存
# （产物按 uuid 命名、内容不变，可安全 immutable 缓存）
location /static/ {
    alias /opt/drama-mill/data/static/;
    sendfile on;
    tcp_nopush on;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# 磁盘监测状态：cron 每 30 分钟由 disk-monitor.sh 写入，直接读文件对外暴露（无需鉴权）
location = /disk_status {
    alias /opt/drama-mill/data/disk_status.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}

location / {
    proxy_pass http://127.0.0.1:5679;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # SSE / 流式 AI 响应：关闭缓冲，边生成边下发
    proxy_buffering off;
    proxy_cache off;

    # 自动化生产编排接口耗时较长
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
